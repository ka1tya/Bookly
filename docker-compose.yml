services:
  postgres:
    image: postgres:16
    container_name: bookly-postgres
    environment:
      POSTGRES_DB: bookly
      POSTGRES_USER: bookly
      POSTGRES_PASSWORD: pyps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookly -d bookly"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bookly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookly.com
      PGADMIN_DEFAULT_PASSWORD: pyps
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
